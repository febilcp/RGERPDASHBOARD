function doGet(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var action = (e && e.parameter && e.parameter.action) ? e.parameter.action : 'getAllData';
    
    if (action === 'ping') {
      return ContentService.createTextOutput(JSON.stringify({ status: 'ok', time: new Date() }))
        .setMimeType(ContentService.MimeType.JSON);
    }
    
    var result = {
      status: 'success',
      tickets: getSheetDataAsJson(ss.getSheetByName('Tickets') || createDefaultTicketsSheet(ss)),
      acUnits: getSheetDataAsJson(ss.getSheetByName('AC_Units') || createDefaultACSheet(ss)),
      renovations: getSheetDataAsJson(ss.getSheetByName('Renovation') || createDefaultRenovationSheet(ss)),
      syncedAt: new Date().toISOString()
    };
    
    return ContentService.createTextOutput(JSON.stringify(result))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    var postData = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var action = postData.action;
    
    if (action === 'addTicket') {
      var sheet = ss.getSheetByName('Tickets') || createDefaultTicketsSheet(ss);
      var t = postData.ticket;
      sheet.appendRow([
        t.mrfNo || '26/AUTO',
        t.year || 2026,
        t.date || new Date().toLocaleDateString(),
        t.time || new Date().toLocaleTimeString(),
        t.villaNumber,
        t.system,
        t.details,
        t.intimatedBy || 'Tenant',
        t.actionTaker || 'loshan /Liton(Riviera Electrician)',
        t.status || 'Pending',
        t.notes || ''
      ]);
      return ContentService.createTextOutput(JSON.stringify({ status: 'success', message: 'Ticket added' }))
        .setMimeType(ContentService.MimeType.JSON);
    }
    
    if (action === 'updateRenovation') {
      var rSheet = ss.getSheetByName('Renovation') || createDefaultRenovationSheet(ss);
      var data = rSheet.getDataRange().getValues();
      var villaNo = Number(postData.villaNumber);
      var updated = false;
      
      for (var r = 1; r < data.length; r++) {
        if (Number(data[r][0]) === villaNo) {
          rSheet.getRange(r + 1, 2).setValue(postData.status);
          rSheet.getRange(r + 1, 3).setValue(postData.cost || 0);
          rSheet.getRange(r + 1, 4).setValue(postData.date || '-');
          rSheet.getRange(r + 1, 5).setValue(postData.notes || '');
          updated = true;
          break;
        }
      }
      
      if (!updated) {
        rSheet.appendRow([villaNo, postData.status, postData.cost || 0, postData.date || '-', postData.notes || '']);
      }
      return ContentService.createTextOutput(JSON.stringify({ status: 'success', message: 'Renovation updated' }))
        .setMimeType(ContentService.MimeType.JSON);
    }
    
    return ContentService.createTextOutput(JSON.stringify({ status: 'unknown_action' }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function getSheetDataAsJson(sheet) {
  if (!sheet) return [];
  var data = sheet.getDataRange().getValues();
  if (data.length <= 1) return [];
  var headers = data[0];
  var rows = [];
  for (var i = 1; i < data.length; i++) {
    var rowObj = {};
    for (var j = 0; j < headers.length; j++) {
      rowObj[headers[j]] = data[i][j];
    }
    rows.push(rowObj);
  }
  return rows;
}

function createDefaultTicketsSheet(ss) {
  var s = ss.insertSheet('Tickets');
  s.appendRow(['mrfNo', 'year', 'date', 'time', 'villaNumber', 'system', 'details', 'intimatedBy', 'actionTaker', 'status', 'notes']);
  return s;
}

function createDefaultACSheet(ss) {
  var s = ss.insertSheet('AC_Units');
  s.appendRow(['id', 'villaNumber', 'room', 'status', 'brand', 'capacityTon', 'modelNo', 'installDate']);
  return s;
}

function createDefaultRenovationSheet(ss) {
  var s = ss.insertSheet('Renovation');
  s.appendRow(['villaNumber', 'status', 'cost', 'date', 'notes']);
  return s;
}
